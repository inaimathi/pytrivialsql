[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytrivialsql"
version = "0.1.26"
authors = [
  { name="inaimathi", email="leo.zovic@gmail.com" },
]
description = "A trivial set of QOL bindings for SQL in Python"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]"]
sqlite = []
mysql = ["PyMySQL[rsa]>=1.0.3"]
mariadb = ["PyMySQL[rsa]>=1.0.3"]
duckdb = ["duckdb>=1.1.3"]
all = [
    "psycopg[binary,pool]",
    "PyMySQL[rsa]>=1.0.3",
    "duckdb>=1.1.3",
]

[project.urls]
Homepage = "https://github.com/inaimathi/pytrivialsql"
Issues = "https://github.com/inaimathi/pytrivialsql/issues"
