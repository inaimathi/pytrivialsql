name: Upload Python Package

on:
  push:
    branches:
      - 'master'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sw0rdfish
          MYSQL_DATABASE: test
          MYSQL_USER: ci
          MYSQL_PASSWORD: sw0rdfish
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psw0rdfish"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: sw0rdfish
          MARIADB_DATABASE: test
          MARIADB_USER: ci
          MARIADB_PASSWORD: sw0rdfish
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -psw0rdfish"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - uses: ikalnytskyi/action-setup-postgres@v6
      with:
        username: ci
        password: sw0rdfish
        database: test
        port: 34837
      id: postgres

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install '.[all]'
        python -m build

    - name: Run unit tests
      run: sh -e unittest.sh
      env:
        POSTGRES_URL: ${{ steps.postgres.outputs.connection-uri }}
        MYSQL_URL: mysql://ci:sw0rdfish@127.0.0.1:3306/test

    - name: Run MariaDB integration tests
      run: python -m unittest discover -s tests -p 'test_mysql.py'
      env:
        MARIADB_URL: mysql://ci:sw0rdfish@127.0.0.1:3307/test

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}